# Release workflow, following Obsidian's "Release your plugin with GitHub
# Actions" guide: a pushed version tag builds the plugin, attests the build
# provenance and creates a DRAFT GitHub release with main.js, manifest.json and
# styles.css. Review the draft, add notes and publish it on GitHub.
#
#   npm version 0.2.0        # bumps package.json, manifest.json and versions.json,
#                            # commits and creates the annotated tag "0.2.0"
#   git push --follow-tags
#
# For the first release (version already in manifest.json):
#
#   git tag -a 0.1.0 -m "0.1.0"
#   git push origin 0.1.0
#
# The tag and the release name must equal the version in manifest.json:
# Obsidian downloads the release whose tag matches it.
#
# Repository setting required once: Settings › Actions › General › Workflow
# permissions › "Read and write permissions".
name: Release Obsidian plugin

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    name: Build and draft release ${{ github.ref_name }}
    # macOS, like CI: the tests run against the platform the plugin supports.
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24 (the version inside current Obsidian builds)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must match manifest.json
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check, lint, test and licence policy
        run: npm run check

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
